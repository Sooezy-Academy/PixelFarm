# Netlify serves the static farm demo. There is no Pixel Agents server behind a
# static site, so the page plays the server's part: it replays a build-time
# snapshot of the farm (scripts/build-demo-snapshot.ts) and simulates the crew
# in the browser (webview-ui/src/transport/staticDemoTransport.ts).
# Node comes from .nvmrc. These settings override the ones in the Netlify UI.

[build]
  command = "npm run build:static-demo"
  publish = "dist/webview"
  # Dependabot branches get no deploy previews (exit code 0 = skip the build).
  ignore = "echo \"$BRANCH\" | grep -q '^dependabot/'"

# AgentChat on the static site: the function holds OLLAMA_API_KEY (a site
# environment variable you set in the Netlify UI) and builds the prompts.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
